[env]
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

[hooks]
postinstall = "lefthook install"

[plugins]
krew = "https://github.com/soupglasses/mise-krew"

[tools]
"github:home-operations/flate" = "v0.6.5"
"github:home-operations/kopiur" = "0.10.12"
"github:mitsuhiko/minijinja" = "3.0.0"
actionlint = "1.7.12"
gum = "2.0.2"
helmfile = "1.8.1"
just = "1.58.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.1"
oxfmt = "0.72.0"
shellcheck = "0.11.0"
talos = "1.14.2"
zizmor = "1.30.1"

"krew:browse-pvc" = "1.4.4"
"krew:cnpg" = "1.30.0"
"krew:node-shell" = "1.11.0"
"krew:rook-ceph" = "0.9.6"
