---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 2
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 19
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/home-operations/vchord:1.5.0@sha256:97b4a1aa15b65c29fa97e84b4270cb235e7bd39e80d4a4b2e91d9fa17997566d
        dynamic_library_path:
          - /usr/lib/postgresql/19/lib/
        extension_control_path:
          - /usr/share/postgresql/19/
    shared_preload_libraries:
      - "vchord"
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  primaryUpdateMethod: switchover
  affinity:
    podAntiAffinityType: required
  resources:
    requests:
      cpu: 150m
      memory: 512Mi
    limits:
      memory: 2Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: &barmanObjectName cloudflare-r2
        # current cluster
        serverName: cnpg19-v1
