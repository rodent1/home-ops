---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: silo-secret
    template:
      data:
        # App
        SECRET_KEY: "{{ .SILO_SECRET_KEY }}"
        DATABASE_URL: "postgres://{{ .SILO_POSTGRES_USER }}:{{ .SILO_POSTGRES_PASS }}@postgres-rw.database.svc.cluster.local:5432/silo"
        # Postgres Init
        INIT_POSTGRES_DBNAME: silo
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .SILO_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .SILO_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: silo
    - extract:
        key: cloudnative-pg
