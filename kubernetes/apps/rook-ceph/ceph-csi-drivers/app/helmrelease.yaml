---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  interval: 1h
  values:
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        log:
          rotation:
            enabled: false
    drivers:
      cephfs:
        enabled: false
      nfs:
        enabled: false
      nvmeof:
        enabled: false
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        clusterName: rook-ceph
        grpcTimeout: 150
        snapshotPolicy: volumeSnapshot
        log:
          rotation:
            enabled: false
        # Per-driver values override the resource fields retained in the live Driver CR.
        nodePlugin:
          priorityClassName: system-node-critical
          resources:
            plugin:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            registrar:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        controllerPlugin:
          # The CSI operator supplies required pod anti-affinity across hostnames.
          replicas: 2
          priorityClassName: system-cluster-critical
          resources:
            plugin:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            attacher:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            provisioner:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            resizer:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            snapshotter:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
