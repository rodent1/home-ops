---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    extraVolumes:
      - name: repo
        nfs:
          server: tank.internal
          path: /mnt/cauldron/Kopiur
    extraVolumeMounts:
      - name: repo
        mountPath: /repo
    features:
      credentialProjection:
        enabled: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
    ui:
      enabled: true

      auth:
        userHeader: x-user-username
        groupsHeader: x-user-groups
        groupsFormat: base64Json
        emailHeader: x-user-email

        proxySecret:
          existingSecret: kopiur-ui-proxy-token-secret
          key: KOPIUR_PROXY_TOKEN

        allowedGroups:
          - admins

      rbac:
        userRoles: true
        bindings:
          - role: user
            groups:
              - admins
      networkPolicy:
        enabled: true
        proxySelector:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: envoy-internal
